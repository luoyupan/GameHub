<!DOCTYPE html>
<!--
  ============================================================
  GameHub - 内置浏览器窗口  (browser.html)
  ------------------------------------------------------------
  这不是一个真正的"网页浏览器"，而是一个**壳**：
    顶部一条自绘工具条（前进 / 后退 / 刷新 / 地址栏 / 下载指示）
    下面用 <webview> 承载真实的网页。

  为什么要自己画一条工具条：
    N 网的页面本身没有任何提示告诉你"现在下载的文件会存到哪"。
    在工具条右侧常驻显示「下载到：xxx\Mods」这条信息，
    用户点下载前就能确认目录对不对 —— 这正好补上了 MOD 最容易踩的坑。
  ============================================================
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>GameHub 浏览器</title>
  <link rel="stylesheet" href="css/browser.css">
</head>
<body>
  <div class="br-root">
    <!-- 自绘标题栏 -->
    <div class="br-bar">
      <div class="br-drag">
        <span class="br-title" id="br-title">GameHub 浏览器</span>
      </div>
      <div class="br-winbtns">
        <button class="br-wb" id="btn-min" title="最小化">─</button>
        <button class="br-wb" id="btn-max" title="最大化">□</button>
        <button class="br-wb br-wb-close" id="btn-close" title="关闭">✕</button>
      </div>
    </div>

    <!-- 导航工具条 -->
    <div class="br-nav">
      <button class="br-btn" id="btn-back" title="后退">‹</button>
      <button class="br-btn" id="btn-fwd" title="前进">›</button>
      <button class="br-btn" id="btn-reload" title="刷新">⟳</button>
      <input class="br-addr" id="br-addr" type="text" spellcheck="false" placeholder="输入网址后回车">
      <button class="br-btn" id="btn-ext" title="用系统浏览器打开">↗</button>
    </div>

    <!-- 下载落点提示：这一条是这个窗口存在的意义 -->
    <div class="br-target" id="br-target">
      <span class="br-target-label">MOD 将下载到</span>
      <span class="br-target-path" id="br-target-path">（未指定）</span>
      <span class="br-target-src" id="br-target-src"></span>
    </div>

    <!-- 下载进度区（有下载时才显示） -->
    <div class="br-dl" id="br-dl" hidden>
      <div class="br-dl-row">
        <span class="br-dl-name" id="br-dl-name"></span>
        <span class="br-dl-stat" id="br-dl-stat"></span>
      </div>
      <div class="br-dl-track"><div class="br-dl-fill" id="br-dl-fill"></div></div>
    </div>

    <!-- 真正的网页 -->
    <!--
      ⚠ partition 必须写死成浏览器服务那个独立分区（persist:gamehub-browser），
      否则 webview 会跑在默认 session 上，主进程挂在浏览器 session 里的
      will-download 钩子永远收不到下载 —— 下载接管就整个失效了。
      改分区名的時候，src/main/browser.js 里的 SESSION_PARTITION 要同步改。
    -->
    <webview id="br-view"
             class="br-view"
             src="about:blank"
             partition="persist:gamehub-browser"
             allowpopups="false"
             nodeintegration="false"
             webpreferences="contextIsolation=true,spellcheck=false"></webview>
  </div>

  <script src="js/browser.js"></script>
</body>
</html>
